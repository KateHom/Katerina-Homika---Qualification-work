<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${store}"></title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />

</head>
<body>

<header th:insert="~{website/header :: header}"></header>

<div class="container mt-4">
    <div class="row">
        <div th:each="element : ${products}" class="col-md-3 mb-4">
                <div class="card h-100 text-center p-2">
                    <img th:src="@{${element.imageUrl}}" alt="Product image" class="mx-auto d-block" style="width:200px; height:auto;">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${element.name}"></h5>
                        <p class="card-text" th:text = "${element.description}"></p>
                        <p class="fw-bold" th:text = "${currency} + ${element.price}"></p>
                        <p th:if="${element.quantity > 0}"
                                th:text = " ${'Availability:'} + ' ' + ${element.quantity}"></p>
                        <p th:if="${element.quantity <= 0}"
                           class="text-muted fst-italic">This item will be available soon!</p>
                        <form th:action="@{/cart/add}" method="post">
                            <input type="hidden" name="productId" th:value="${element.id}">

                            <!-- Кнопка станет неактивной (серой), если количество <= 0
                             button become grey if quantity <=0 -->
                            <button type="submit"
                                    class="btn btn-primary"
                                    th:disabled="${element.quantity <= 0}">
                                Add to Cart
                            </button>
                        </form>
                    </div>
                </div>
         </div>
    </div>
</div>

<div th:insert="~{website/footer :: footer}"></div>

</body>
</html>
