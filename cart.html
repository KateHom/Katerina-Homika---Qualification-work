<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
</head>

<body>

<header th:insert="~{website/header :: header}"></header>

<div class="container mt-4">
    <h2>Your Cart</h2>

    <div th:if="${#maps.isEmpty(cartItems)}" class="alert alert-info mt-3">
        Cart is empty. <a href="/" class="alert-link">Back to the website</a>
    </div>

    <div th:if="${not #maps.isEmpty(cartItems)}">

        <!-- таблица для корзины - cart table -->
    <div th:fragment="cartTable">
    <table class="table table-bordered mt-3">
        <thead class="table-light">
        <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Total</th>
            <th>Remove</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="entry : ${cartItems}">
            <td th:text="${entry.key.name}"></td>
            <td>
                <!-- кнопки для добавления или уменьшение товара в корзине
                links to decrease or increase the product in cart -->
                <div class="d-flex align-items-center">
                    <a th:href="@{/cart/decrease(productId=${entry.key.id})}"
                       class="btn btn-outline-secondary btn-sm me-2">−</a>
                <span th:text="${entry.value}" class="mx-2"></span>
                    <a th:href="@{/cart/increase(productId=${entry.key.id})}"
                       class="btn btn-outline-secondary btn-sm ms-2">+</a>
                </div>
            </td>
            <!-- Цена за единицу товара - price for one unit of item -->
            <td class="text-start" th:text="${#numbers.formatDecimal(entry.key.price, 1, 'POINT', 2, 'POINT') + ' €'}">
                </td>

            <!-- Сумма за позицию (Цена * Количество) - price for all units of product-->
            <td class="text-start fw-bold text-success"
                th:text="${#numbers.formatDecimal(entry.key.price * entry.value, 1, 'POINT', 2, 'POINT') + ' €'}">
            </td>
            <td>
                <!-- кнопка для удаления - link to remove all -->
                <a th:href="@{/cart/remove(productId=${entry.key.id})}"
                   class="btn btn-danger btn-sm">
                    🗑️ Remove
                </a>
            </td>
        </tr>
        </tbody>
    </table>
        <!-- Блок для вывода ошибки, если товара не хватает на складе -->
        <div class="row center">
            <div class="col-md-4">
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            </div>
        </div>
        <!-- под таблицей отображение общего количества товаров и сумма
         under the table shows total item pieces and price -->
        <div class="card-footer bg-white p-3 d-flex justify-content-between align-items-center">
            <span class="text-muted">Total item: <strong th:text="${cartCount}"></strong></span>
            <div>
                <span class="fs-4 me-2">Total price:</span>
                <span class="fs-3 fw-bold text-primary"
                      th:text="${#numbers.formatDecimal(totalPrice, 1, 'POINT', 2, 'POINT') + ' €'}"></span>
            </div>
        </div>
    </div>

        <!-- Форма оформления заказа - form for completion the order -->
        <div class="card mt-4 p-3 bg-light">
            <h4>Placing an order</h4>
        <form action="/cart/checkout" method="post" class="mt-2">
            <div class="mb-3">
                <label class="form-label">Name:</label>
                <input type="text" name="customerName" class="form-control" required>
                <!-- required - указывается когда это поле должно быть обязательно заполнено -->
            </div>

            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" name="customerEmail" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success">Confirm the order</button>
        </form>
        </div>
</div>
    <!-- ссылка для продолжения покупок - link to continue shopping -->
    <a href="/" class="btn btn-secondary">Continue shopping</a>
</div>

<footer th:insert="~{website/footer :: footer}"></footer>


</body>
</html>
