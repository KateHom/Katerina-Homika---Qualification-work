<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Warehouse - Item stock</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light">

<!-- Верхняя навигационная панель склада - Upper navigation bar for warehouse management -->
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📦 Item stock</h2>
        <div>
            <a href="/orders" class="btn btn-outline-primary">Orders</a>
            <a href="history" class="btn btn-primary">History</a>
            <a href="/" class="btn btn-outline-secondary">Back to website</a>
        </div>
    </div>

    <!-- Таблица товаров на складе - list of product on the warehouse -->
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Item</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Change the price/stock</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}">
                    <td th:text="${product.id}"></td>
                    <td th:text="${product.name}" class="fw-bold"></td>
                    <td th:text="${product.category}"></td>
                    <td th:text="${product.price + ' EUR'}"></td>
                    <td>
                        <!-- если количество товаров меньше чем 5б количество подсвечивается красным
                         if item quantity is smaller than 5, quantity is marked as red-->
                        <span th:class="${product.quantity < 5} ? 'badge bg-danger fs-6' : 'badge bg-success fs-6'"
                              th:text="${product.quantity}"></span>
                    </td>
                    <td>
                        <!-- Форма быстрого изменения информации - form of fast editing-->
                        <form action="/warehouse/update-information" method="post" class="d-flex align-items-center gap-2">
                            <input type="hidden" name="productId" th:value="${product.id}">
                            <input type="number" step="0.01" min="0" name="newPrice" th:value="${product.price}" class="form-control four-column-sm" style="width: 80px" required>
                            <input type="number" name="newQuantity" th:value="${product.quantity}" min="0" class="form-control form-control-sm" style="width: 60px;" required>
                            <button type="submit" class="btn btn-primary btn-sm">Save</button>
                        </form>
                    </td>
                </tr>

                <!-- сообщение если в продуктах пусто - massage if product is empty -->
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="6" class="text-center text-muted">No item on the warehouse.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
