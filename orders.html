<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Warehouse - orders</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light">

<!-- Верхняя навигационная панель склада - Upper navigation bar for warehouse management -->
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📋 Customer Orders</h2>
        <div>
            <a href="history" class="btn btn-primary">History</a>
            <a href="/products" class="btn btn-outline-primary">Item stock</a>
            <a href="/" class="btn btn-outline-secondary">Back to website</a>
        </div>
    </div>

    <!-- Таблица заказов - order table -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-bordered align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Order №</th>
                    <th>Date</th>
                    <th>Item</th>
                    <th>Quantity</th>
                    <th>Customer</th>
                    <th>Email</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <th:block th:each="entry : ${ordersByNumber}">
                    <tr th:each="item, iterStat : ${entry.value}">

                        <!-- Эти ячейки показываем только в первой строчке заказа с объединением строк (rowspan) -->
                        <!-- These cells are shown only in the first row of the order with row spanning -->
                        <td th:if="${iterStat.first}" th:rowspan="${#lists.size(entry.value)}" class="fw-bold align-middle bg-white">
                            <span th:text="${entry.key}"></span>
                        </td>
                        <td th:if="${iterStat.first}" th:rowspan="${#lists.size(entry.value)}" class="align-middle bg-white"
                            th:text="${#temporals.format(entry.value[0].orderDate, 'dd.MM.yyyy HH:mm')}">
                        </td>

                        <!-- Список товаров заказа (отдельные строки внутри блока) - items list which was ordered -->
                        <td th:text="${item.productName}"></td>
                        <td th:text="${item.productQuantity}" class="text-center"></td>

                        <!-- Данные покупателя с объединением строк - customer informasiton in one raw-->
                        <td th:if="${iterStat.first}" th:rowspan="${#lists.size(entry.value)}" class="align-middle bg-white"
                            th:text="${entry.value[0].customerName}"></td>
                        <td th:if="${iterStat.first}" th:rowspan="${#lists.size(entry.value)}" class="align-middle bg-white"
                            th:text="${entry.value[0].customerEmail}"></td>

                        <!-- опция выбора статуса для заказа - option to choose order status -->
                        <td th:if="${iterStat.first}" th:rowspan="${#lists.size(entry.value)}" class="align-middle bg-white">
                            <form action="/warehouse/orders/update-status" method="post" class="d-flex align-items-center gap-2">
                                <input type="hidden" name="orderNumber" th:value="${entry.key}">
                                <select name="newStatus" class="form-select form-select-sm" style="width: 140px;">
                                    <option value="NEW" th:selected="${entry.value[0].orderStatus.name() == 'NEW'}">New</option>
                                    <option value="PROCESSING" th:selected="${entry.value[0].orderStatus.name() == 'PROCESSING'}">Processing</option>
                                    <option value="COMPLETED" th:selected="${entry.value[0].orderStatus.name() == 'COMPLETED'}">Completed</option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-primary">ОК</button>
                            </form>
                        </td>
                    </tr>
                </th:block>

                <!-- показывает сообщение если нет заказов - shot the message if not orders -->
                <tr th:if="${#maps.isEmpty(ordersByNumber)}">
                    <td colspan="7" class="text-center text-muted py-4">No orders.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
