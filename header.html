<div th:fragment="header" xmlns:th="http://www.thymeleaf.org">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <div class="d-flex flex-column flex-md-row align-items-center pb-3 mb-4 border-bottom">
        <img src="/images/store_element_w_back.png" width="60" height="60" class="me-2" viewBox="0 0 118 94" role="img">

        <a href="/" class="d-flex align-items-center link-body-emphasis text-decoration-none">
            <span class="fs-4">Cosmetics Store</span>
        </a>

        <nav class="d-inline-flex mt-2 mt-md-0 ms-md-auto">
            <a href="/cart" class="btn btn-outline-primary position-relative" style="margin-right: 40px;">
                🛒 Cart <span th:text="${cartCount}"></span>
                <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"></span>
            </a>

            <a class="me-3 py-2 link-body-emphasis text-decoration-none" href="/">Home</a>
            <a class="me-3 py-2 link-body-emphasis text-decoration-none" href="/about">About us</a>
            <a class="me-3 py-2 link-body-emphasis text-decoration-none" href="/support">Support</a>

        </nav>

    </div>
    <div id="cartPopup" class="modal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Your Cart</h5>
                    <button type="button" class="btn-close" id="closeCart"></button>
                </div>
                <div class="modal-body">
                    <div th:replace="~{website/cart :: cartTable}"></div>
                </div>
            </div>
        </div>
    </div>
</div>
